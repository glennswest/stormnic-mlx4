[package]
name = "stormnic-mlx4"
description = "Rust no_std UEFI EFI_SIMPLE_NETWORK driver for ConnectX-3, loaded by stormbootx from its boot media"
version = "0.2.5"
edition = "2021"
license = "MIT"

[[bin]]
name = "stormnic-mlx4"
path = "src/main.rs"

[features]
# Print the whole bring-up trace on the console at every boot (#16). Without
# it the trace is printed only when the EFI variable StormnicVerbose is set
# (src/console.rs).
verbose = []

[dependencies]
uefi = { version = "0.39", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.15"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
